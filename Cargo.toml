[workspace]
resolver = "2"
members = [
    "crates/hime-core",
    "crates/hime-ffi",
    "crates/hime-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
hime-core = { path = "crates/hime-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
